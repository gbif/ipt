eml.project.personnel.lastName=Último Nome
eml.project.personnel.salutation=Salutation
eml.project.personnel.intro=O pessoal envolvido no projeto
eml.project.funding=Financiamento
eml.project.funding.help=Informação sobre fontes de financiamento para o projeto (ex. numero de contrato, nomes e endereços das fontes de financiamento). Outras informações relacionadas ao financiamento também podem ser incluídas.
eml.project.studyAreaDescription.descriptorValue=Descrição da Área de Estudo
eml.project.studyAreaDescription.descriptorValue.help=Documenta a área física associada com o projeto de pesquisa. Pode incluir descrições da cobertura geográfica, temporal e taxonomica do local de pesquisa.
eml.project.designDescription=Descrição do Design
eml.project.designDescription.help=Uma descrição textual geral do projeto de pesquisa. Pode incluir descrições detalhadas dos objetivos, motivações, teoria, hipóteses, estratégia, projeto estatístico e trabalhos atuais.

eml.studyExtent=Área de Estudo
eml.studyExtent.help=Descrição da Área de amostra específica e a frenquência de amostra (limites temporais, frenquência de ocorrência). A área geográfica de estudo geralmente substitui a Área documentada em "Descrição da Área de Estudo" da seção "Dados do Projeto".
eml.sampleDescription=Descrição da Amostra
eml.sampleDescription.help=Descrição dos protocolos usados durante o projeto de pesquisa. O conteúdo deste elemento pode ser similar a descrição dos métodos encontrados nas seções "métodos" de artigos de revistas científicas.
eml.qualityControl=Controle de Qualidade
eml.qualityControl.help=Uma descrição de ações tomadas para controlar ou avaliar a qualidade dos dados resultantes das descrições de passos associados.
eml.methodSteps=Descrição do Passo
eml.methodSteps.help=Este campo permite um conjunto de elementos que documentam uma série de métodos e procedimentos utilizados no estudo, e as etapas de processamento que levam à produção dos arquivos de dados. Eles incluem descrições de texto dos procedimentos, Literatura relevante, software, instrumentação, fonte de dados e quaisquer medidas de controle de qualidade. Cada método deve ser descrito em detalhes suficientes para permitir que outros pesquisadores possam interpretar e repetir, se necessário, o estudo.
eml.citation.citation=Referência do Recurso
eml.citation.citation.help=Uma única citação para ser usada quando o dataset for citando. Ative a auto-geração para deixar o IPT auto-gerar a citação para você. O formato de citação usado na geração automática é baseado no formato de citação preferencial do DataCite e satisfaz a <a href\="https\://www.force11.org/datacitation" target\="_blank">Declaração Conjunta de Princípios de Citação de Dados</a>. Este formato inclui um número de versão, que é especialmente importante para conjuntos de dados que são continuamente atualizados. <br /><br /> Exemplo de citação com um criador institucional\: <br /><br />"Biodiversity Institute of Ontario (2011) Migratory birds of Ontario. Version 1.2. University of Guelph. Dataset/Species occurrences. https\://doi.org/10.5886/qzxxd2pa"<br /><br /> Exemplo de citação com 9 criadores\: <br /><br />"Brouillet L, Desmet P, Coursol F, Meades SJ, Favreau M, Anions M, Belisle P, Gendreau C, Shorthouse D (2010) Database of vascular plants of Canada. Version 1.2. Universite de Montreal Biodiversity Centre. Dataset/Species checklist. https\://doi.org/10.5886/1bft7W5f"
eml.citation.generate.turn.on=Auto-geração está DESLIGADO - Ligar
eml.citation.generate.turn.off=Auto-geração está LIGADO - Desligar

eml.citation.identifier=Identificador de Citação de Recurso
eml.citation.identifier.help=Um DOI, URI ou outro identificador persistente que permita um conjunto de dados ser resolvido on-line. Recomenda-se o identificador ser incluído na citação. Por favor, note que se o recurso tiver um DOI atribuído (usando o IPT), o IPT define o DOI como o identificador de citação e ele não poderá ser editado.
eml.bibliographicCitationSet.bibliographicCitations.citation=Citação bibliográfica
eml.bibliographicCitationSet.bibliographicCitations.citation.help=A citação de um recurso externo relacionado ou utilizado na criação deste recurso.
eml.bibliographicCitationSet.bibliographicCitations.identifier=Identificador de citação bibliográfica
eml.bibliographicCitationSet.bibliographicCitations.identifier.help=Um DOI, URI, ou outro identificar persistente que identifica o recurso externo online. Deve ser utilizado na citação, geralmente no final.
eml.collection=Coleção
eml.collection.plural=Coleções
eml.collection.plural.help=A lista de coleções representa as coleções que este recurso se baseia.
eml.collectionName=Nome da Coleção
eml.collectionName.help=Nome oficial da Coleção no idioma local.
eml.collectionId=Identificador da Coleção
eml.collectionId.help=A URI (LSID ou URL) da coleção. Em RDF, usado como URI do recurso da coleção.
eml.collection.required=É obrigatório pelo menos uma coleção.
eml.parentCollectionId=Identificador da Coleção Parental
eml.parentCollectionId.help=Identificador para a coleção parental desta subcoleção. Permite a construção da hierarquia de coleções e subcoleções. Por favor, coloque o valor "Not applicable" se esta coleção não tem uma coleção parental.
