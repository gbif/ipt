manage.mapping.intro=Cada coluna da fonte de dados pode ser mapeada para um ou mais campos nesta extensão. Você também pode especificar um valor estático para cada campo que é usado para todos os registros, ou definir uma tradução entre os valores de sua fonte de dados e o valor usado. <br/> <br/> Observe a coluna na fonte que contém uma chave única para cada linha/registro deve ser mapeada para o identificador. Se você deseja mapear outras fontes, este identificador é necessário e será usado para interligar suas linhas de fonte. <br/> <br/> Também um filtro pode ser usado para incluir somente os registros que correspondam a um critério definido para um dos campos de dados de origem.

