manage.overview.publishing.doi.reserve.confirm=Você está prestes a reservar um DOI para este recurso. Esteja ciente de que você ainda pode excluir o DOI, enquanto ele ainda não tiver sido registrado. Você ainda quer a reserva?
manage.overview.publishing.doi.reserve.help=Após os metadados obrigatórios serem inseridos, você pode reservar um DOI para um recurso. Para reutilizar um DOI existente, insira o DOI no campo de identificador de citação dos metadados do recurso. Se um recurso está disponível publicamente e com um DOI reservado, a próxima publicação resultará em uma nova versão principal do recurso e o DOI será registrado. Caso contrário, se um recurso é privado e com um DOI reservado, a próxima publicação resultará em uma nova versão secundária do recurso e o DOI não será registrado. Esteja ciente de que até um DOI ser registrado, você ainda poderá apaga-lo.
manage.overview.publishing.doi.reserve.new.help=Você pode solicitar um novo DOI para um recurso publicado que já tenha um DOI atribuído. Esteja ciente que o DOI será registrado na próxima vez que o recurso for publicado e será considerado a versão do recurso recém publicado. O antigo DOI ainda resolverá a versão anterior, mas exibirá um aviso de que ele foi substituído por um novo. Também esteja ciente de que você ainda pode excluir o DOI solicitado, contanto que não esteja publicado.
manage.overview.publishing.doi.reserve.prevented.noOrganisation=Você não pode atribuir um DOI a esse recurso até que uma organização com uma conta no DataCite esteja associada a este IPT. Entre em contato com o administrador do seu IPT para fazer isso.
manage.overview.publishing.doi.delete.confirm=Você está prestes a excluir um DOI reservado para este recurso. Considerando que este DOI nunca foi registrado, ele nunca foi disponibilizado publicamente e é seguro excluir. Ainda quer excluir?
manage.overview.publishing.doi.delete.help=Você pode excluir o DOI reservado para este recurso. Uma vez que este DOI nunca foi registrado e nem resolvido publicamente, é segura a sua exclusão.
manage.overview.publishing.doi.register.agreement=Confirme que você entende que os DOIs não podem ser excluídos uma vez que forem registrados.
manage.overview.publishing.doi.register.help=O DOI que foi reservado para uma versão pendente deste recurso será registrado na próxima vez que o recurso for publicado.
manage.overview.publishing.doi.register.prevented.notPublic=Você não pode registrar o DOI que foi reservado para este recurso porque o recurso é particular. Para registrar o DOI, torne público o recurso e depois publique o recurso.
manage.overview.publishing.doi.minorVersion.confirm=You are about to publish a new <b><span class\=''text-visibility-{0}''>{1}</span> minor</b> version of this resource. If there have been scientifically significant changes to the resource since the last publication, you should cancel, assign this resource a new DOI, and then publish again.
manage.overview.publishing.doi.majorVersion.confirm=You are about to publish a new <b><span class\=''text-visibility-{0}''>{1}</span> major</b> version of this resource, which is appropriate the first time a resource is assigned a DOI, or after the resource underwent scientifically significant changes. Following successful publication, the DOI reserved for this resource will be registered and should resolve after about 5 minutes. If this is not what you want, cancel and delete the reserved DOI.
manage.overview.publishing.withoutDoi.majorVersion.confirm=You are about to publish a new <b><span class\=''text-visibility-{0}''>{1}</span> major</b> version of this resource, which is appropriate the first time a resource is published, or after the resource underwent scientifically significant changes. If this is not what you want, cancel.
manage.overview.publishing.doi.summary=Antes de publicar, você pode ajudar os pesquisadores, utilizando seus dados, para sumarizar o que foi alterado nesta versão.
