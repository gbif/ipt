eml.physicalData.charset=Conjunto de Caracteres
eml.physicalData.charset.help=Contém o nome da codificação de caracteres. Este é tipicamente ASCII ou UTF-8, ou uma das outras codificações comuns.
eml.physicalData.distributionUrl=Download URL
eml.physicalData.distributionUrl.help=A URL para copiar o recurso no formato mencionado.
eml.physicalData.format=Formato dos Dados
eml.physicalData.format.help=Formato do arquivo de dados <br /><b>Exemplo(s)\:</b><br /><i>Microsoft Excel</i>
eml.physicalData.formatVersion=Versão do Formato dos Dados
eml.physicalData.formatVersion.help=Versão do formato<br/><b>Exemplo(s)\:</b><br/><i>2000 (9.0.2720)</i>
eml.physicalData.other=Outros Formatos de Dados
eml.physicalData.other.help=Links para os seus recursos de dados em outros formatos (exemplo, dumps de bancos de dados, planilhas, nexus, dados ligados, etc.).
eml.keywords.keywordThesaurus=Thesaurus/Vocabulário
eml.keywords.keywordThesaurus.help=Um nome para o thesaurus/vocabulário de onde a palavra-chave foi derivada. Os Thesaurus de Palavras-Chave são usualmente específicos e podem ser customizados ou oficiais. Se as palavras-chave não foram extraídos de um thesaurus/vocabulário específico, coloque <i>''n/a''</i><br /><br /><b>Exemplo(s)\: </b><br /><i>"IRIS keyword thesaurus"</i>
eml.keywords.keywordsString=Lista de Palavras-Chave
eml.keywords.keywordsString.help=Palavras-chave que descrevem suscitamente o recurso ou são relacionados ao recurso. Separe cada palavra-chave com vírgulas.
eml.hierarchyLevel=Nível de Hierarquia
eml.hierarchyLevel.help=Nível do conjunto de dados correspondente ao metadado. O valor padrão para GBIF é <i>conjunto de dados</i>.
eml.pubDate=Data da última publicação
eml.pubDate.help=A data em que o recurso foi publicado pela última vez. Esta é atualizada automaticamente a cada vez que o recurso é publicado.
eml.dateStamp=Date First Published
eml.dateStamp.help=A data em que a primeira versão do recurso foi publicado. Será utilizada para a definição do ano de publicação na citação do recurso.
eml.distributionUrl=URL do Recurso
eml.distributionUrl.short=Início
eml.logoUrl=URL do logo do recurso
eml.logoUrl.help=A URL do logo associado com o recurso. Se você não tem uma URL para o logo do recurso, você pode carregar um arquivo de imagem selecionado do disco.
eml.purpose=Propósito
eml.purpose.description=A synopsis of the purpose of this dataset. It may include one or more paragraphs, including a summary of key findings if appropriate.
