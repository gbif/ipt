eml.specimenPreservationMethod.help=Palavras-Chave do vocabulário Método de Preservação de Espécimes do GBIF, indicando o processo e técnica utilziada para prevenir deterioração física das coleções não-vivas. Se a coleção tem mais de um método de preservação, selecione o predominante. Recorde que pode incluir uma lista de métodos para um espécime no elemento "Preparações" do mapeamento de dados DwC (http\://rs.tdwg.org/dwc/terms/preparations). Por favor, não selecione tratamentos para coleções vivas.
eml.alternateIdentifier=Identificador Alternativo
eml.alternateIdentifier.help=Um identificador adicional, secundário para esta entidade. Quando o recurso for publicado, a URL do IPT para o recurso é adicionado à lista de identificadores. Quando um recurso é atribuído um novo DOI (usando o IPT), o IPT garante que este DOI é colocado em primeiro lugar na lista de identificadores. Quando um recurso é registrado com o Registro do GBIF, UUID do recurso único do Registro também é adicionado à lista de identificadores. Se o recurso representa um recurso já existente e registrado no Registro do GBIF, o UUID do recurso registrado pode ser adicionado à lista de identificadores de recurso. Isto permitirá que o recurso do IPT atualize o recurso existente durante o registo, em vez de registrar um novo recurso... <br / > <b>exemplo (s)\:</b> <br / > <i>4fa7b334-ce0d-4e88-aaae-2e0c138d049e</i>, <i>VCR3465</i>

eml.intellectualRights.simple=Direitos
eml.intellectualRights.licence.cczero=To the extent possible under law, the publisher has waived all rights to these data and has dedicated them to the <a href\="http\://creativecommons.org/publicdomain/zero/1.0/legalcode">Public Domain (CC0 1.0)</a>. Users may copy, modify, distribute and use the work, including for commercial purposes, without restriction.
eml.intellectualRights.licence.ccby=This work is licensed under a <a href\="http\://creativecommons.org/licenses/by/4.0/legalcode">Creative Commons Attribution (CC-BY 4.0) License</a>.
eml.intellectualRights.licence.ccbync=This work is licensed under a <a href\="http\://creativecommons.org/licenses/by-nc/4.0/legalcode">Creative Commons Attribution Non Commercial (CC-BY-NC 4.0) License</a>.
eml.intellectualRights.license=Licença de Dados
eml.intellectualRights.license.help=A licença que você aplica sobre um conjunto de dados fornece uma maneira padronizada para definir a utilização apropriada do seu trabalho. O GBIF incentiva os publicadores a adotarem a licença menos restritiva possível entre as três opções de leitura por máquinas (CC0 1.0, CC-BY 4.0 ou CC-BY-NC 4.0) para incentivar a utilização e aplicação mais ampla possível dos dados. Saiba mais <a href\="https\://www.gbif.org/pt/terms/licences" target\="_blank"> aqui</a>. Se você é incapaz de selecionar uma das três opções, e o seu conjunto de dados contém dados de ocorrências, você não poderá registrar o conjunto de dados no GBIF ou torná-lo globalmente disponível através do GBIF.org. Se você se sentir incapaz de selecionar uma das três opções, entre em contato com o Secretariado do GBIF em participation@gbif.org.
eml.intellectualRights.nolicenses=Nenhuma licença selecionada
eml.intellectualRights.license.disclaimer=Você deve aplicar a licença somente ao seu próprio trabalho, a menos que tenha direitos necessários para aplica-la ao trabalho de terceiros.

