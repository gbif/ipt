manage.mapping.info=Um filtro exclui registros correspondentes a partir do arquivo gerado. Por exemplo, especifique &quot;ColumnA IsNotNull&quot; para incluir somente registros que tenham algum valor na ColumnA. <br /> <br /> Um filtro pode ser muito útil se a mesma extensão é mapeado várias vezes para fazer pivôs. Se você tem duas colunas para nomes populares, uma para Inglês, um para Português, na mesma fonte, você pode mapear a mesma fonte duas vezes para a extensão nomes vernáculo. Mapear uma das duas colunas para cada mapeamento e definir o filtro na mesma coluna de IsNotNull. Dessa forma, somente os registros de extensão que realmente têm um nome vernáculo vão para o arquivo de dados final.
