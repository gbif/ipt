admin.config.publishResources.details=This button will <strong>republish all resources.</strong><br /><br /> For each DwC resource, it will create a new Darwin Core Archive, EML metadata and RTF. For each Frictionless Data resource, it will create a Data Package and a metadata file. It will notify the GBIF registry of the new publication, and update the IPT''s metadata in the registry.<br /><br />Use this button if\:<br /> a) Multiple resources have been updated, and you want to publish a new version for all of them instead of publishing them individually.<br /> b) the Public URL has been changed and you want to update the IPT''s registered datasets to reflect the change.
