manage.metadata.gettingStarted=Getting Started
manage.metadata.gettingStarted.description=One or more paragraphs describing the dataset''s overall interpretation, content and structure. For example, the number and names of data files, the types of measurements that they contain, how those data files fit together in an overall design, and how they relate to the data collection methods, experimental design, and sampling design described in other EML sections. One might describe any specialized software that is available and/or may be necessary for analyzing or interpreting the data, and possibly include a high-level description of data formats if they are unusual.
manage.metadata.gettingStarted.help=You can input HTML by clicking <b>&lt;/&gt;</b>. The HTML will be converted to DocBook in the EML, so some HTML combinations may not work.<br/><br/>Allowed HTML tags\: <ul><li><b>&lt;div&gt;</b></li> <li><b>&lt;p&gt;</b></li> <li><b>&lt;ul&gt;</b></li> <li><b>&lt;ol&gt;</b></li> <li><b>&lt;li&gt;</b></li> <li><b>&lt;h1&gt;</b></li> <li><b>&lt;pre&gt;</b></li> <li><b>&lt;a&gt;</b></li> <li><b>&lt;b&gt;</b></li> <li><b>&lt;em&gt;</b></li> <li><b>&lt;sup&gt;</b></li> <li><b>&lt;sub&gt;</b></li></ul>
