manage.resource.create.coreType.selection=Selecione um tipo
manage.resource.create.coreType.help=The type of resource. If optional archived resource is loaded, the type will be determined automatically and overwrite your selection. <ul><li><b>Occurrence\:</b> the basis of the resource is occurrences in nature (observations) or in a collection (specimens).<br /></li><li><b>Checklist\:</b> the basis of the resource is taxon names.<br /></li><li><b>Sampling Event\:</b> the basis of the resource is a sampling event.<br /></li><li><b>Metadata\:</b> a resource having information about a dataset, but without having the actual primary data. A metadata resource might give information about a collection that has not yet been digitized, for example.<br /></li><li><b>Other\:</b> use this option if you are unsure which type your resource should be. Once you begin mapping the data, the type will be updated automatically.<br /></li></ul>
