manage.overview.publishing.doi.replaced=O DOI atribuído para a versão atual vai ser substituído pelo DOI reservado para a versão pendente da próxima vez que o recurso for publicado.
manage.overview.publishing.doi.reserve.reused=Um DOI [{0}] existente já foi atribuído a esse recurso e será reutilizado. Se este não for o DOI correto, você pode excluir o DOI reservado, remover ou substituir o DOI do campo identificador de citação nos metadados do recurso e então tentar reservar um outro DOI.
