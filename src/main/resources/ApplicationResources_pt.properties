resource.status.deleted=Excluído, porém Público
resource.creator.firstname=Primeiro Nome
resource.creator.lastname=Último Nome
resource.creator.email=Email
resource.coreType.help=O tipo de recurso. O valor desse campo depende do esquema de metados de mapeamento do recurso e não é mais editável se o mapeamento já foi feito com o Darwin Core.
resource.subtype.help=O subtipo do recurso. As opções para esse campo depende do Tipo de campo. <ul><li><b>Autoridade Taxonômica\:</b> um checklist oficial de classificações e sinônimos taxonômicos<br /></li><li><b>Autoridade de Nomenclatura\:</b> um checklist oficial de nomenclautras e informações sobre publicações<br /></li><li><b>Invetório Temático\:</b> um checklist temático que tem um tema por nomes de agrupamento, ex. parasitas de elefantes<br /></li><li><b>Inventório Regional\:</b> um checklist regional que tem uma região comum em agrupamento de nomes, ex. espécies em áreas protegidas<br /></li><li><b>Dataset Global de Espécies\:</b> um checklist taxonômico com uma cobertural espacial global. Esse subtipo é usado em particular por catálagos agregados sobre a vida<br /></li><li><b>Derivado de Ocorrência\:</b> um checklist taxonômico que foi derivado de dados originados de dados de ocorrências<br /></li><li><b>Espécime\:</b> Dados de espécime. Normalmente de coleções de museus<br /></li><li><b>Observações\:</b> Dados de observações. Normalmente de monitoramento e de observações de campo<br /></li></ul>
resource.subtype.selection=Selecione um subtipo
resource.subtype.none=Nenhum subtipo
resource.updateFrequency=Frequência de atualização
resource.updateFrequency.help=A freqüência com que as mudanças e adições são feitas no dataset após a conclusão do dataset inicial. A escolha de diário, semanal, mensal, semestral ou anualmente qualifica o recurso no modo auto-publicação\: <ul><li><b>Atualmente\:</b> atualizado 1 vez ao ano<br /></li><li><b>Quando necessário\:</b> atualizado quando necessário<br /></li><li><b>Bianual\:</b> atualizado 2 vezes ao ano<br /></li><li><b>Continuamente\:</b> atualizado continuamente<br /></li><li><b>Diariamente\:</b> atualziado 1 vez por dia<br /></li><li><b>Irregular\:</b> atualizado em intervalos irregulares<br /></li><li><b>Mensalmente\:</b> atualizado 1 por mês<br /></li><li><b>Não plenejado\:</b> novas atualizações não são planejadas<br /></li><li><b>Semanalmente\:</b> atualizado 1 vez por semana<br /></li><li><b>Desconhecido\:</b> novas atualizações podem acontecer, mas sem previsão<br /></li><li><b>Outro período de manutenção\:</b> atualizado de acordo com algum outro intervalo de tempo.<br /></li></ul>

