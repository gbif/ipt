admin.config.setup2.welcome=Por favor, forneça informação adicional para a instalação básica do IPT.
admin.config.setup2.administrator.title=IPT Default administrator
admin.config.setup2.administrator=Administrador default
admin.config.setup2.administrator.help=A senha para a conta de administrador default pode ser modificada depois, mas o email não pode ser alterado sem que se elimine e crie novamente o usuário.
admin.config.setup2.mode.title=Modo do IPT
admin.config.setup2.mode.help=Selecione o modo em que deseja executar o IPT. O modo do IPT determina se os recursos alocados serão ou não indexados pelo GBIF, com o objetivo de facilitar o acesso público. GBIF recomenda aos administradores do IPT usar o modo de Teste primeiro para entender o processo de registro, e então reinstalar no modo de Produção para a publicação definitiva. <strong>Atenção</strong>\:  para esta inslação, a seleção é definitiva e não pode ser alterada depois. Para trocar do modo de teste para o de produção, ou vice-versa, você deve reinstalar o IPT e repetir todas as configurações.
admin.config.setup2.mode.test=<strong>Test</strong> mode is for evaluating the IPT or running it in a training scenario. Resources registered with GBIF will go into the test registry and will not show on gbif.org. All DOIs assigned to resources in test mode should use a test prefix, meaning they are temporary.
admin.config.setup2.mode.test.label=Test
admin.config.setup2.mode.production=<strong>Production</strong> mode is for publishing resources formally. Resources registered with GBIF go into the GBIF Registry and will be indexed and shown on gbif.org. DOIs minted for resources cannot be deleted, and require resources to remain publicly accessible.
admin.config.setup2.mode.production.label=Production
admin.config.setup2.success=Parabéns\! A configuração do seu IPT está completa.
admin.config.setup2.next=Por favor, primeiro revise a seção de admnistração, crie novos administradores e instale as extensões adequadas antes você gerenciar os recursos.
admin.config.setup2.existingFound=Um "IPT data directory" existente foi encontrado no local fornecido e será utilizado com todo o seu conteúdo anterior.
admin.config.setup2.failed=Falha ao configurar a conta de Administração. Não é possível escrever no arquivo do usuário\: {0}
admin.config.setup2.datadir.notExist=Por favor, configure um "data directory" antes de configurar um "default administrator"
admin.config.setup2.already.registered=O IPT já foi designado para executar em modo {0}. Para acessar o modo PRODUÇÃO, por favor, forneça uma URL de base para qual o IPT está disponível publicamente e assegure que a opção de produção está marcada. Caso contrário, se deseja executar outro modo do IPT, por favor pare seu servidor e reinicie a instalação especificando um novo diretório de dados.
admin.config.setup2.nonadmin=O usuário já existe como um usuário sem permissões de administrador.
admin.config.setup2.mode=IPT mode
admin.config.setup2.nomode=Por favor, selecione o modo que você gostaria de executar o IPT.
admin.config.setup2.publicURL.title=Public URL
admin.config.setup2.publicURL.details=The public (Internet) URL for this IPT.<br /><br />The URL that points to the root of your IPT installation. If you wish to register resources with GBIF, you must have a publicly accessible address. For example, https\://ipt.example.org or https\://www.example.org/ipt
admin.config.setup2.forwardProxyURL.title=Forward proxy URL
admin.config.setup2.forwardProxyURL.details=An optional institutional proxy server address.<br /><br />This setting is required on some institutional networks. If the IPT must make outbound HTTP and HTTPS requests through an institutional proxy, enter the address and port number here. For example, http\://proxy.example.org\:8080

