manage.mapping.rows.problem.notForeignKey={0} doesn''t point to another table, so it can''t take another table''s key.
manage.mapping.rows.problem.noLinkedMapping={0} points to {1}, but no mapping from {2} makes that key. Map that table from {2} too.
manage.mapping.rows.problem.noPairs={0} takes the matching item from another list column, but no column is chosen for it.
