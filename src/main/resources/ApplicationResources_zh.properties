manage.overview.publishing.doi.confirm.end=你仍然要發佈嗎？
manage.overview.publishing.doi.replaced=此版本的 DOI 將為下次發布所保留的 DOI 所取代。
manage.overview.publishing.doi.reserve.reused=此資源已有指派的 DOI {0} 並將繼續使用。如果此 DOI 是錯誤的，請移除或取代詮釋資料「引用識別碼」欄位的內容，再試著保留另一 DOI。
manage.overview.publishing.doi.reserve.notRreused=因為此 IPT 受到限制而只能指派前綴為 {1} 的 DOI，此資源既有的 DOI {0} 無法再次使用。您可以移除或取代詮釋資料「引用識別碼」欄位的內容，再試著保留另一 DOI。若您仍想使用既有的 DOI，請聯繫 IPT 系統管理員以獲得協助。
