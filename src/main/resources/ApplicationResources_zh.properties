admin.config.setup2.already.registered=此 IPT 已經設定成在{0}模式執行。請記得在正式模式下，您必須輸入一個可公開存取的 URL，並確認您在設定時選取「正式模式」。如果您想要以不同模式執行 IPT，請您停止伺服器程序並在重新設定時選取新的資料目錄。
