admin.config.setup.welcome=為了使用 IPT，您必須選擇一個資料目錄讓 IPT 儲存它的配置資訊，亦即所謂的 IPT 資料目錄。
admin.config.setup.instructions=請選擇一個空的、可寫入的資料夾，或者是一個已存在的 IPT 資料目錄。不要選擇一個容易受到其他行程影響的資料夾，如 /tmp，它在系統啟動時會被清空。這個資料夾應該保持定期備份與災難恢復計劃。
admin.config.setup.examples=例如：使用路徑如視窗環境下的 "C\:\\datadir" ，或是類 UNIX 環境（如 Linux, Mac OS X）下的 "/srv/datadir"。
admin.config.setup.datadir=The absolute path to your data directory
admin.config.setup.datadir.created=您已經成功地建立一個新的資料目錄。
admin.config.setup.datadir.reused=您已經成功地指定一個已存在的資料目錄。
admin.config.setup.datadir.absolute=資料目錄的路徑必須是絕對的，不是相對的（例如是 /var/tmp/data，而不是 data）。
admin.config.setup.datadir.error=指定的資料目錄已存在，並且似乎不適合當做 IPT 的資料目錄。
admin.config.setup.datadir.writable=無法寫入資料目錄 "{0}"。

admin.config.setup2.welcome=請為 IPT 提供額外的安裝資訊。
admin.config.setup2.administrator.title=IPT Default administrator
