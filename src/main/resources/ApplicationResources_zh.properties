manage.tables.intro=Your source has one row per occurrence. A Darwin Core Data Package keeps the data in separate tables that point to each other by keys, so each event or agent, such as a person or an organization, is written only once. Untick what you don''t want: each ticked table becomes a mapping you can open and change, and the mappings you already have are kept.
manage.tables.intro.event=Your source has no occurrenceID column, so its rows are read as events. A Darwin Core Data Package keeps the data in separate tables that point to each other by keys, so each event or agent, such as a person or an organization, is written only once. Untick what you don''t want: each ticked table becomes a mapping you can open and change, and the mappings you already have are kept.
manage.tables.intro.material=Your source has no occurrenceID or eventID column, so its rows are read as specimens. A Darwin Core Data Package keeps the data in separate tables that point to each other by keys, so each event or agent, such as a person or an organization, is written only once. Untick what you don''t want: each ticked table becomes a mapping you can open and change, and the mappings you already have are kept.
manage.tables.existing=Some tables are already mapped from this source, so they''re unticked. Ticking one adds a second mapping of it.
manage.tables.filled={0} is set to "{1}": every row has a value above 0 in {2}.
manage.tables.ask={0} is required and not in the source. Value for every row:
manage.tables.varies={0} isn''t the same inside every event (for example {1}), so it isn''t mapped to the event table. Fix the source, or map it yourself.
manage.tables.parentMissing=parentEventID isn''t mapped: some parent events aren''t events in the rows read (for example {0}), and a parent needs its own row in the event table. Add them from another source, then map parentEvent_fk yourself.
manage.tables.after=Open each new mapping from the resource overview to check its Result before publishing.
manage.tables.unused=Columns no table uses: {0}. Their data isn''t published unless you map them yourself.
manage.tables.created=Mappings created: {0}
manage.tables.unavailable.schema=Tables can only be suggested for Darwin Core Data Packages with an occurrence table.
manage.tables.unavailable.source=The source can''t be read.
manage.tables.unavailable.noRowKey=Tables can only be suggested for a source with one row per occurrence, event or specimen, which needs an occurrenceID, eventID, materialEntityID or catalogNumber column. This source has none of them.
manage.tables.why.occurrence={0} is different on every row, so it makes the key.
manage.tables.why.event=Rows with the same {0} make one event, and {0} makes its key. Columns with one value inside every event: {1}
manage.tables.why.event.rows={0} makes the key. Columns with one value inside every event: {1}
manage.tables.why.event.made=There''s no eventID column, so the event key is made from other columns. Key columns: {0}. Columns with one value inside every event: {1}
manage.tables.why.event.one=There''s no eventID column and no date or place, so every row goes into one event. Columns with one value in every row: {0}
manage.tables.why.agent=Names are separated by "{1}". Each different name becomes one agent, with a key made from the name. Name columns: {0}.
manage.tables.why.agent.ids=Names are separated by "{1}". Each different name becomes one agent, with a key made from the name and, as its agentID, the ID at the same place in the ID columns. Name columns: {0}. ID columns: {2}.
manage.tables.why.role=One row per name in {0}, linking the agent to the occurrence as {1}.
manage.tables.why.role.event={0} is the same inside every event, so the agents are linked to the event as {1}: one row per name and event.
manage.tables.why.role.event.rows={0} differs inside some events, so every name in it is linked to its event as {1}: one row per name and event.
manage.tables.why.role.varies={0} differs inside some events (for example {2}), so the agents are linked to each occurrence as {1}: one row per name in {0}.
manage.tables.why.role.material=One row per name in {0}, linking the agent to the specimen as {1}.
manage.tables.why.identification=Only needed to keep an identification history: the occurrence table already holds the identification.
manage.tables.why.identification.material=Only needed to keep an identification history: the material table already holds the identification.
manage.tables.why.material=Every row is also a specimen: one material per row, linked to its occurrence and event. Specimen columns: {0}. Key: {1}.
manage.tables.why.material.event=Every row is also a specimen: one material per row, linked to its event. Specimen columns: {0}. Key: {1}.
manage.tables.why.material.rows=One material per row, with its identification, linked to its event. Specimen columns: {0}. Key: {1}.
manage.tables.why.material.rows.noEvent=One material per row, with its identification. There''s no date or place to make events from. Specimen columns: {0}. Key: {1}.
manage.tables.why.material.sample=The rows of one sample make one material, linked to its event. Sample column: {0}. Columns with one value inside every sample: {1}
