eml.citation.citation=資源引用文字
eml.citation.citation.help=引用此資料集時所使用的單一引用條目。開啟自動產生以便 IPT 為您自動產生引用條目。自動產生的引用條目基於 DataCite 的建議，且滿足<a href\="https\://www.force11.org/datacitation" target\="_blank">資料引用原則聯合聲明（Joint Declaration of Data Citation Principles）</a>。該格式包含版本編號，對於持續更新的資料集來說特別重要。<br /><br />機構創建者的範列條目：<br /><br />「Biodiversity Institute of Ontario (2011) Migratory birds of Ontario. Version 1.2. University of Guelph. Dataset/Species occurrences. https\://doi.org/10.5886/qzxxd2pa」<br /><br />九位創建者的範例條目：<br /><br />「Brouillet L, Desmet P, Coursol F, Meades SJ, Favreau M, Anions M, Belisle P, Gendreau C, Shorthouse D (2010) Database of vascular plants of Canada. Version 1.2. Universite de Montreal Biodiversity Centre. Dataset/Species checklist. https\://doi.org/10.5886/1bft7W5f」
