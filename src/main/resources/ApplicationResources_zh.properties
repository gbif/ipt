manage.mapping.gen.none.desc=The value comes from the source column chosen above, unchanged. Where that column is empty and a constant value is given, the constant value is used.
manage.mapping.gen.ITEM.desc=For rows made from a list: each row gets its own item, so “Collector A | Collector B” gives Collector A in one row and Collector B in the next.
manage.mapping.gen.POSITION.desc=For rows made from a list: where the item is in its list, so in “Collector A | Collector B” Collector A gets 1 and Collector B gets 2.
manage.mapping.gen.ID.desc=A code made from the column''s value, or from the list item. The same value always gives the same code, so a key stays the same every time the data is published.
manage.mapping.gen.LINK.desc=Copies the key of the {0} made from the same source row, so this row points to it.
manage.mapping.gen.TEMPLATE.desc=Text you write with column names in curly brackets, such as {0}. Each row fills in its own values.
manage.mapping.gen.PAIRED.desc=For a column whose list goes with the one the rows are made from: you choose that column below. With recordedBy “Collector A | Collector B” and recordedByID “orcid-A | orcid-B”, Collector A''s row gets orcid-A and Collector B''s row gets orcid-B.
