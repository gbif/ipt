manage.mapping.rows.merge.info=Source rows that give the same value become one row: an agent is listed once, however many occurrences it is linked to. Rows without a value stay rows of their own. Other empty values are filled from the rows merged with them; if those hold different values, publishing stops, because the IPT doesn''t choose between values.
manage.mapping.rows.merge.wholeRow=identical rows (the whole row)
