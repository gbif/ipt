resource.coreType.help=The type of resource. The value of this field depends on the core mapping of the resource and is no longer editable if the Darwin Core mapping has already been made.
resource.subtype.help=The subtype of the resource. The options for this field depend on the Type field. <ul><li><b>Taxonomic Authority\:</b> a taxonomic checklist that is authoritative in its classification and synonymy<br /></li><li><b>Nomenclator Authority\:</b> a nomenclatoral checklist that is authoritative in the pure names and publication information<br /></li><li><b>Inventory Thematic\:</b> a thematic checklist that has a theme for grouping names, e.g. parasites of elephants<br /></li><li><b>Inventory Regional\:</b> a regional checklist that has a regional commonality in grouping names, e.g. species in a protected area<br /></li><li><b>Global Species Dataset\:</b> a taxonomic checklist with a global, spatial coverage. This subtype is used in particular by the Catalogue of Life to assemble its aggregated checklist<br /></li><li><b>Derived from Occurrence\:</b> a taxonomic checklist that has been derived from data that was originally occurrence data<br /></li><li><b>Specimen\:</b> Specimen data. Possible museum collection<br /></li><li><b>Observation\:</b> Observation data. Possible monitoring and field observations<br /></li></ul>
resource.subtype.selection=Select a subtype
