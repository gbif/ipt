manage.metadata.gettingStarted=Getting Started
manage.metadata.gettingStarted.description=One or more paragraphs describing the dataset''s overall interpretation, content and structure. For example, the number and names of data files, the types of measurements that they contain, how those data files fit together in an overall design, and how they relate to the data collection methods, experimental design, and sampling design described in other EML sections. One might describe any specialized software that is available and/or may be necessary for analyzing or interpreting the data, and possibly include a high-level description of data formats if they are unusual.
manage.metadata.gettingStarted.help=Use the toolbar to format the text: bold, subscript, superscript, links, section headings, bullet and numbered lists, and preformatted text. A section heading starts a new section, which runs until the next heading.<br/><br/>The text is stored as DocBook in the EML. Pasted text keeps only the formatting listed above.
manage.metadata.introduction=Introduction
manage.metadata.introduction.description=One to many paragraphs that provide background and context for the dataset with appropriate figures and references.  This is similar to the introduction for a journal article, and would include, for example, project objectives, hypotheses being addressed, what is known about the pattern or process under study, how the data have been used to date (including references), and how they could be used in the future.
manage.metadata.introduction.help=Use the toolbar to format the text: bold, subscript, superscript, links, section headings, bullet and numbered lists, and preformatted text. A section heading starts a new section, which runs until the next heading.<br/><br/>The text is stored as DocBook in the EML. Pasted text keeps only the formatting listed above.
