manage.tables.intro=Your source has one row per occurrence. A Darwin Core Data Package keeps the data in separate tables that point to each other by keys, so each event or agent, such as a person or an organization, is written only once. Untick what you don''t want: each ticked table becomes a mapping you can open and change, and the mappings you already have are kept.
manage.tables.intro.event=Your source has no occurrenceID column, so its rows are read as events. A Darwin Core Data Package keeps the data in separate tables that point to each other by keys, so each event or agent, such as a person or an organization, is written only once. Untick what you don''t want: each ticked table becomes a mapping you can open and change, and the mappings you already have are kept.
manage.tables.intro.material=Your source has no occurrenceID or eventID column, so its rows are read as specimens. A Darwin Core Data Package keeps the data in separate tables that point to each other by keys, so each event or agent, such as a person or an organization, is written only once. Untick what you don''t want: each ticked table becomes a mapping you can open and change, and the mappings you already have are kept.
