eml.taxonomicCoverages.error.limitExceeded=The taxonomic coverage can''t be inferred: each mapped rank has more than 100 distinct names, too many to list. Please enter the taxonomic coverage manually.
eml.taxonomicCoverages.error.fieldsNotMapped=No se pudieron inferir los metadatos porque no se mapearon todos los datos requeridos. Mapee los siguientes campos\: kingdom, phylum, class, order, family. Si ya se han mapeado, intente volver a inferirlos.

eml.temporalCoverages.type=Tipo de Cobertura Temporal
eml.temporalCoverages.singleDate=Fecha Única
eml.temporalCoverages.singleDate.help=Esta fecha pretende representar una cobertura que abarca un día. La fecha se almacena en el formato AAAA-MM-DD
eml.temporalCoverages.startDate=Fecha Inicial
eml.temporalCoverages.startDate.help=La fecha en que comienza la cobertura. La fecha se almacena en el formato AAAA-MM-DD
eml.temporalCoverages.endDate=Fecha Final
eml.temporalCoverages.endDate.help=La fecha en que finalizó la cobertura. La fecha se almacena en el formato AAAA-MM-DD
eml.temporalCoverages.formationPeriod=Periodo de formación
eml.temporalCoverages.formationPeriod.help=Descripción del periodo de tiempo durante el cual se organizó la colección (p.ej., "Victoriano", "1922-1932", "c. 1750"). Use este tipo para indicar una colección permanente o en crecimiento (p.ej., "2010-presente").
eml.temporalCoverages.livingTimePeriod=Época de existencia
eml.temporalCoverages.livingTimePeriod.help=Un nombre o periodo de tiempo durante el cual el material biológico estuvo vivo. Incluye períodos de tiempo paleontológicos y otras frases de texto. Por ejemplos\:"1900-1950", "Dinastía Ming", "Pleistoceno".
eml.temporalCoverages.error.fieldsNotMapped=No se pudieron inferir los metadatos porque no se mapearon todos los datos requeridos. Mapee el siguiente campo\: eventDate. Si ya se ha mapeado, intente volver a inferirlo.
eml.temporalCoverages.error.dateParseException=No se pudieron inferir los metadatos\: excepción de análisis de fecha

eml.project.title=Título
eml.project.identifier=Identificador
eml.project.identifier.help=Un identificador único para el proyecto de investigación. Este puede usarse para unir múltiples instancias de conjuntos de datos/EML que están asociados de alguna manera al mismo proyecto, por ejemplo una serie de monitoreo. La naturaleza de la asociación puede ser descrita en la descripción del proyecto.
eml.project.description=Descripción
eml.project.description.help=Resumen sobre el proyecto de investigación.
eml.project.award=Subvención al Proyecto
eml.project.award.help=El campo de adjudicación se utiliza para proporcionar información específica sobre las subvenciones de financiación para un proyecto en un formato estructurado. Se proporcionan subcampos para el nombre de la agencia financiadora, los identificadores del Open Funder Registry para la agencia y el programa que otorgó la subvención, el número de subvención asignado, el título de la subvención y la URL de la página que describe la subvención. En general, la agencia de financiación debe figurar con una referencia cruzada al identificador apropiado del Open Funder Registry (incluido en la distribución de EML pero actualizado periódicamente desde el Open Funder Registry).
eml.project.award.funderName=Nombre del financiador
eml.project.award.funderName.help=El nombre de la institución financiadora, con siglas completamente ampliadas para mostrar el nombre oficial completo de la agencia financiadora.
eml.project.award.funderIdentifier=Identificador del financiador
eml.project.award.funderIdentifier.help=El identificador del financiador se utiliza para proporcionar uno o más identificadores canónicos que hacen referencia al financiador.
eml.project.award.awardNumber=Número de la subvención
eml.project.award.awardNumber.help=El campo Número de la subvención proporciona el identificador único utilizado por el financiador para identificar de forma única una subvención.
eml.project.award.title=Título
eml.project.award.title.help=El campo título se utiliza para el título del premio o subvención que se describe.
eml.project.award.awardUrl=URL de la subvención
eml.project.award.awardUrl.help=Normalmente, la URL de la subvención o premio se utiliza para buscarla y localizarla y, por lo general, dirige a la ubicación de Internet para obtener más información sobre  esta.  Esto debería apuntar a un sitio de financiación para la subvención, en lugar de un sitio de proyecto.
eml.project.relatedProjects=Proyectos relacionados
eml.project.relatedProjects.help=Este campo es un enlace recursivo a otro proyecto. Esto permite que los proyectos se anidan uno debajo del otro en el caso de que un proyecto genere otro.
eml.project.relatedProject.title=Título
eml.project.relatedProject.identifier=Identificador
eml.project.relatedProject.description=Descripción
eml.project.relatedProject.personnel=Personal relacionado con el proyecto
eml.project.relatedProject.personnel.required=Se requiere al menos un miembro del personal relacionado con el proyecto.
eml.project.personnel=Personas asociadas al proyecto
eml.project.personnel.help=Esta lista representa a las personas involucradas en el proyecto.
eml.project.personnel.required=Se requiere al menos un contacto del personal
eml.project.personnel.firstName=Nombre
eml.project.personnel.lastName=Apellido
eml.project.personnel.salutation=Tratamiento
eml.project.personnel.intro=Personas asociadas al proyecto
eml.project.funding=Fuentes de Financiación
eml.project.funding.help=Información acerca de las fuentes de financiación del proyecto, tales como\: becas y números de contrato; nombres y direcciones de las fuentes de financiación, periodo activo, etc. Puede ser incluida información adicional relacionada con las fuentes de financiación.
eml.project.studyAreaDescription.descriptorValue=Descripción del área de estudio
eml.project.studyAreaDescription.descriptorValue.help=Descripción del área física asociada con el proyecto de investigación. Puede incluir la descripciones de la cobertura geográfica, temporal y taxonómica del área mencionada.
eml.project.designDescription=Descripción del diseño
eml.project.designDescription.help=Una descripción general del diseño de la investigación. Puede incluir un informe detallado de objetivos, motivaciones, teoría, hipótesis, estrategia, diseño estadístico y  trabajo en campo.

eml.studyExtent=Área de Estudio
eml.studyExtent.help=Descripción del área de muestreo específica y la frecuencia de muestreo (límites temporales, frecuencia de registro). El área geográfica de estudio generalmente sustituye el área documentada en “Descripción del área de estudio” de la sección “Datos del Proyecto”.
eml.sampleDescription=Descripción del muestreo
eml.sampleDescription.help=Descripción de los protocolos de muestreo usados para originar los datos del recurso. La descripción puede ser similar a los procedimientos de muestreo encontrados en la sección de métodos de un artículo científico.
eml.qualityControl=Control de Calidad
eml.qualityControl.help=Una descripción de las acciones tomadas para controlar o evaluar la calidad de los datos que resultan de la sección "Metodología paso a paso".
eml.methodSteps=Metodología paso a paso
eml.methodSteps.help=Este campo describe los elementos que documentan la serie de métodos y procedimientos utilizados en el estudio, y los pasos que condujeron a la producción de los datos del archivo. Estos incluyen descripciones textuales de los procedimientos, la literatura relevante, software, instrumentación, conjuntos de datos y las medidas de control de calidad adoptadas. Cada método debe ser descrito suficiente detalle para, si es necesario, permitir a otros investigadores interpretar y replicar el estudio.
eml.citation.citation=¿Cómo referenciar este recurso?
eml.citation.citation.help=La referencia que debe usarse cuando se haga uso del conjunto de datos. Active la generación automática para que el IPT autogenere la referencia por usted. El formato de la referencia utilizado en la generación automática se basa en el formato recomendado\: referencia de DataCite y satisface la <a href\="https\://www.force11.org/datacitation" target\="_blank">"Joint Declaration of Data Citation Principle"</a>. Este formato incluye un número de versión, que es importante especialmente para los conjuntos de datos que se actualizan continuamente.<br /><br /> Ejemplo de la referencia con el creador institucional\: <br /><br /> "Instituto de biodiversidad de Ontario (2011) Aves migratorias de Ontario. Versión 1.2. Universidad de Guelph. Conjunto de datos/Registros biológicos. https\://.doi.org/10.5886/qzxxd2pa "<br /><br /> Ejemplo de la referencia con 9 creadores\: <br /><br />" Brouillet L, Desmet P, Coursol F, Meades SJ, Favreau M, aniones M, Belisle P, C Gendreau, Shorthouse D (2010) Base de datos de las plantas vasculares de Canadá. Versión 1.2. Universite de Montreal Biodiversity Centre. Conjunto de datos/Lista de especies. https\://doi.org/10.5886/1bft7W5f"
eml.citation.generate.turn.on=Generación automática Desactivada - Activar
eml.citation.generate.turn.off=Generación automática Activada - Desactivar

eml.citation.identifier=Identificador de la Referencia del Recurso
eml.citation.identifier.help=Un DOI, URI u otro identificador persistente que se resuelva en el conjunto de datos en línea. Se recomienda incluir el identificador en la citación. Tenga en cuenta que si el recurso tiene un DOI asignado (utilizando el IPT), el IPT establece el DOI como el identificador de la cita y no puede ser editado.
eml.bibliographicCitationSet.bibliographicCitations.citation=Referencia bibliográfica
eml.bibliographicCitationSet.bibliographicCitations.citation.help=La referencia de un recurso externo relacionado con o utilizado en la creación de este recurso.
eml.bibliographicCitationSet.bibliographicCitations.identifier=Identificador de la referencia bibliográfica
eml.bibliographicCitationSet.bibliographicCitations.identifier.help=Un DOI, URI u otro identificador persistente que se resuelva en el recurso externo en línea. Se debe utilizar en la citación, generalmente al final.
eml.collection=Colección
eml.collection.plural=Colecciones
eml.collection.plural.help=La lista de colecciones representa las colecciones en las que se basa este recurso.
eml.collectionName=Nombre de la Colección
eml.collectionName.help=Nombre oficial de la colección en el idioma local.
eml.collectionId=Identificador de la Colección
eml.collectionId.help=El URI (LSID o URL) de la colección. En RDF, utilizado como URI del recurso de la colección.
eml.collection.required=Se requiere al menos una colección.
eml.parentCollectionId=Identificador de la Colección Parental
eml.parentCollectionId.help=Identificador para la colección parental de esta subcolección. Permite la construcción de la jerarquía de colecciones y subcolecciones. Por favor ingrese el valor "No aplica", si esta colección no tiene una colección parental.
