eml.title=Título
eml.title.help=Un título descriptivo para el recurso, usado en títulos de página y citaciones. Esto es para personas, no para máquinas, así que evite usar un nombre de archivo, nombre de base de datos o abreviaturas conocidas solo dentro de su organización.
