manage.overview.visibility=Visibilidad
manage.overview.visibility.description=La visibilidad de un recurso determina quién podrá verlo, si la vista es privada para los editores (privado), disponible para todos (público), visible en todo el mundo a través del sitio web de GBIF (registrada) o eliminado pero aún disponible a todo el mundo debido a que se le asignó un DOI (eliminado pero público). De manera predeterminada, cada recurso es visible sólo para el usuario que lo creó y cualquier otro usuario que tenga el rol de Administrador en el IPT donde se creó el recurso.
