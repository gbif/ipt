resource.shortname=Nombre corto
resource.shortname.help=El nombre corto funciona como un identificador para el recurso dentro de este IPT y será usado como un parámetro en la URL de acceso al recurso a través de Internet. Por favor, use únicamente caracteres alfanuméricos, guiones o guiones bajos.
