admin.config.setup2.administrator.help=La contraseña para el administrador predeterminado puede ser modificada más adelante, pero el correo electrónico no puede ser modificado, a menos que elimine y cree nuevamente el usuario.
admin.config.setup2.mode.title=Modo del IPT
admin.config.setup2.mode.help=Seleccione el modo en que desea ejecutar el IPT. El modo del IPT determina si los recursos alojados serán o no indexados por GBIF, con el fin de facilitar el acceso público. GBIF recomienda a los administradores del IPT usar en un principio el modo Prueba para entender el proceso de registro y luego reinstalarlo en modo Producción para efectuar publicaciones formales. <strong>ADVERTENCIA</strong>\: para esta instalación, la selección es definitiva y posteriormente no puede ser cambiada. Para cambiar del modo Prueba al modo Producción o viceversa, tendrá que reinstalar su IPT y repetir las configuraciones hechas.
admin.config.setup2.mode.test=El modo <strong>prueba</strong> es para evaluar el IPT o ejecutarlo en un escenario de entrenamiento. Los recursos registrados en GBIF irán al registro de prueba y no se mostrarán en gbif.org. Todos los DOIs asignados a recursos en modo de prueba deben usar un prefijo de prueba, lo que significa que son temporales.
admin.config.setup2.mode.test.label=Prueba
admin.config.setup2.mode.production=El modo <strong>producción</strong> es para publicar recursos formalmente. Los recursos registrados en GBIF entran en el Registro de GBIF (GBIF Registry) y serán indexados y mostrados en gbif.org. Los DOIs asignados a los recursos no pueden ser borrados, y requieren que los recursos permanezcan accesibles al público.
admin.config.setup2.mode.production.label=Producción
admin.config.setup2.success=¡Felicidades\! Se completó la instalación de su IPT.
admin.config.setup2.next=Por favor primero revise la sección de Administración, cree los nuevos editores e instale las extensiones adecuadas antes de empezar a administrar los recursos.
admin.config.setup2.existingFound=Se encontró un directorio de datos IPT existente para ser usado. Este directorio existente y todo su contenido serán utilizados.
admin.config.setup2.failed=No se logró configurar una cuenta de administrador. No se puede escribir el archivo de usuario\: {0}
admin.config.setup2.datadir.notExist=Por favor, primero configure un directorio de datos, antes de configurar un administrador predeterminado
admin.config.setup2.already.registered=El IPT ya ha sido designado para ejecutarse en modo {0}. Para proceder en modo PRODUCCIÓN, por favor ingrese una URL base para que el IPT esté disponible públicamente y asegúrese que la casilla de producción esté marcada. Si por el contrario, desea ejecutar el IPT en otro modo, por favor detenga su servidor y reinicie la instalación especificando un nuevo directorio de datos.
admin.config.setup2.nonadmin=El usuario ya existe como un usuario sin derechos de administrador.
admin.config.setup2.mode=Modo del IPT
admin.config.setup2.nomode=Por favor, seleccione el modo en que desea ejecutar el IPT.
admin.config.setup2.publicURL.title=URL pública
admin.config.setup2.publicURL.details=La URL pública (Internet) para este IPT.<br /><br />La URL que apunta a la raíz de su instalación IPT. Si desea registrar recursos con GBIF, debe tener una dirección de acceso público. Por ejemplo, https\://ipt.example.org o https\://www.example.org/ipt
admin.config.setup2.forwardProxyURL.title=URL del proxy de reenvío
admin.config.setup2.forwardProxyURL.details=Una dirección de servidor proxy institucional opcional.<br /><br />Esta configuración es necesaria en algunas redes institucionales. Si el IPT debe realizar solicitudes HTTP y HTTPS salientes a través de un proxy institucional, ingrese la dirección y el número de puerto aquí. Por ejemplo, http\://proxy.example.org\:8080

admin.config.setup3.installationComplete=Instalación completa
admin.config.setup3.welcome=¡Felicitaciones\! Ha instalado satisfactoriamente su IPT. Por favor oprima "continuar" para empezar a usarlo.
admin.config.setup3.welcomeWithIssues=Ha instalado su IPT, pero hubo errores durante la instalación. Presione continuar para verificar los registros de error o comuníquese con su administrador.

admin.config.archivalMode=Modo archivo
admin.config.archivalMode.help=Por favor seleccione esta casilla si desea que su IPT archive todas las versiones publicadas para todos los recursos. Esto permitirá realizar un seguimiento al historial de versiones de un recurso. Si está deseleccionada, las versiones anteriores serán reemplazadas por la última. Tenga cuidado de no quedarse sin espacio en el disco.
admin.config.archivalMode.error=Modo archivo inválido (debe ser verdadero or falso)
admin.config.archivalLimit=Número de versiones archivadas (requiere el Modo de Archivo)
admin.config.archivalLimit.help=Cuando el Modo de Archivo está activado, las versiones archivadas más antiguas se eliminarán automáticamente cuando se publique una nueva versión, manteniendo sólo el número configurado de versiones archivadas por recurso.  Deje este campo vacío para conservar todas las versiones archivadas.
