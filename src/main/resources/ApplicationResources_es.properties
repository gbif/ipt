manage.mapping.info=Un filtro excluye los registros coincidentes del archivo generado. Por ejemplo, especifique &quot;ColumnA IsNotNULL&quot;  para incluir únicamente los registros que tengan un valor en la ColumnA.<br /><br />Un filtro puede ser muy útil si la misma extensión es mapeada varias veces para crear tablas cruzadas. Si tiene dos columnas para nombres comunes, uno en Inglés y otro en Español, en la misma fuente de datos, puede hacer un mapeo adicional hacia la extensión de nombres comunes. Mapee una de las dos columnas en cada mapeo y establezca el filtro en la misma columna para IsNotNULL. De este modo, únicamente los registros de la extensión que realmente tienen un nombre común, quedarán en el archivo final.
