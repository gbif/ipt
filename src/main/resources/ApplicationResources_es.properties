manage.resource.create.coreType=Tipo
manage.resource.create.coreType.selection=Seleccione un tipo
manage.resource.create.coreType.help=El tipo de recurso. Si se carga un archivo del recurso, el tipo se determinará automáticamente y reemplazará la selección del usuario. <ul><li><b>Registro Biológico\:</b> la base del recurso son los registros biológicos en la naturaleza (observaciones) o en una colección (especímenes). <br /></li><li><b>Lista de chequeo\:</b> la base del recurso son los nombres de taxones.<br /></li><li><b>Evento de muestreo\:</b> la base del recurso es un evento de muestreo.<br /></li><li><b>Metadatos\:</b> un recurso que contiene información sobre un conjunto de datos, pero sin los datos primarios. Un recurso de metadatos puede proporcionar información sobre una colección que aún no se ha digitalizado, por ejemplo.<br /></li><li><b>Otro\:</b> utilice esta opción si no está seguro de qué tipo debe ser su recurso. Una vez que comience a mapear los datos, el tipo se actualizará automáticamente.<br /></li></ul>
manage.resource.create.coreType.dwca=Archivo Darwin Core
manage.resource.create.coreType.dp=Paquete Frictionless Data
resource.subtype=Subtipo
resource.status.private=Privado
resource.status.public=Público
resource.status.registered=Registrado
resource.status.deleted=Eliminado, pero publico
resource.creator.firstname=Nombre
resource.creator.lastname=Apellido
resource.creator.email=Correo electrónico
resource.coreType.help=El tipo del recurso. El valor de este campo depende del mapeo del recurso y no es posible editarlo si el mapeo Darwin Core ya se ha hecho.
resource.subtype.help=El subtipo del recurso. Las opciones de este elemento dependen del elemento Tipo. <ul><li><b>Autoridad Taxonómica\:</b> una lista de chequeo taxonómica que es autoridad en su clasificación y sinonimia.<br /></li><li><b>Autoridad Nomenclatural\:</b> una lista de chequeo nomenclatural que es autoridad en los nombres y la información de publicación.<br /></li><li><b>Inventario Temático\:</b> una lista de chequeo que se sirve de un tema para agrupar nombres, p. ej. parásitos de elefantes.<br /></li><li><b>Inventario Regional\:</b> una lista de chequeo que contiene una comunidad regional que agrupa nombres, p. ej. especies en un área protegida.<br /></li><li><b> Conjunto de Datos de Especies Globales\:</b> una lista taxonómica con cobertura geográfica global. Este subtipo es usado particularmente por el catálogo de la vida para ensamblar sus agregados.<br /></li><li><b>Derivado del Registro Biológico\:</b> una lista de chequeo taxonómica que se deriva de los datos que fueron originalmente datos de registros biológicos.<br /></li><li><b>Espécimen\:</b> datos de los especímenes. Posible colección de museo.<br /></li><li><b>Observación\:</b> datos de observaciones. Posibles monitoreos y observaciones de campo.<br /></li></ul>
resource.subtype.selection=Seleccione un subtipo
resource.subtype.none=Sin subtipo
resource.updateFrequency=Frecuencia de actualización
resource.updateFrequency.help=La frecuencia con la cual se realizarán cambios o adiciones en el conjunto de datos, después de haber publicado el conjunto de datos inicial. Para utilizar el modo de auto-publicación del recurso, puede elegir una frecuencia diaria, semanal, mensual, semestral o anual\: <ul><li><b>Anual\:</b> actualizado una vez por año.<br /></li><li><b>Cuando sea necesario\:</b> actualizado cuando se requiera.<br /></li><li><b>Semestral\:</b> actualizado cada seis meses.<br /></li><li><b>Continuo\:</b> actualizado continuamente.<br /></li><li><b>Diario\:</b> actualizado una vez por día.<br /></li><li><b>Irregular\:</b> actualizado en intervalos irregulares.<br /></li><li><b>Mensual\:</b> actualizado una vez por mes.<br /></li><li><b>No planeado\:</b> no esta planeado ser actualizado.<br /></li><li><b>Semanal\:</b> actualizado una vez por semana.<br /></li><li><b>Desconocido\:</b>puede ser actualizado, pero no se sabe con certeza.<br /></li><li><b>Otro periodo de actualización\:</b> actualizado acorde a otro intervalo de tiempo.<br /></li></ul>

