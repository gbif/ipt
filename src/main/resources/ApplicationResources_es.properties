eml.description.help=Una breve descripción general del recurso que se está documentando, dividida en párrafos.<br/><br/>Puede ingresar HTML haciendo clic en <b>&lt;/&gt;</b>. El HTML se convertirá a DocBook en el EML, por lo que algunas combinaciones HTML podrían no funcionar.<br/><br/>Etiquetas HTML permitidas\: <ul><li><b>&lt;div&gt;</b></li> <li><b>&lt;p&gt;</b></li> <li><b>&lt;ul&gt;</b></li> <li><b>&lt;ol&gt;</b></li> <li><b>&lt;li&gt;</b></li> <li><b>&lt;h1&gt;</b></li> <li><b>&lt;pre&gt;</b></li> <li><b>&lt;a&gt;</b></li> <li><b>&lt;b&gt;</b></li> <li><b>&lt;em&gt;</b></li> <li><b>&lt;sup&gt;</b></li> <li><b>&lt;sub&gt;</b></li></ul>
