admin.config.publishResources.details=Este botón <strong>publicará de nuevo todos los recursos.<strong><br /><br /> Para cada recurso DwC, creará un nuevo Darwin Core Archive, metadatos EML y RTF. Para cada recurso Frictionless Data, creará un Paquete de Datos y un archivo de metadatos. Notificará al registro de GBIF de la nueva publicación, y actualizará los metadatos del IPT en el registro.<br /><br />Utilice este botón si\:<br /> a) Múltiples recursos han sido actualizados, y desea publicar una nueva versión para todos ellos en lugar de publicarlos individualmente.<br /> b) la URL Pública ha sido cambiada y desea actualizar los conjuntos de datos registrados en el IPT para reflejar el cambio.
