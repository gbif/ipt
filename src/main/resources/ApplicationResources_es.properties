eml.publishingOrganisation.help=Por favor seleccione la organización responsable para la publicación (producción, liberación, mantenimiento) este recurso. Se utilizará como organización publicadora del recurso cuando se haga el registro en GBIF y al someter los metadatos durante el registro de los DOI. También se utilizará para generar la referencia del recurso (si la generación automática está activada), así que considere la importancia de este rol. Por favor tenga en cuenta que su selección no puede ser cambiada después de que el recurso ha sido registrado en GBIF o le ha sido asignado un DOI.
