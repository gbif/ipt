eml.physicalData.charset=Conjunto de caracteres
eml.physicalData.charset.help=Contiene el nombre de la codificación de caracteres. Esto es típicamente ASCII o UTF-8, o una de las codificaciones comunes.
eml.physicalData.distributionUrl=URL del archivo
eml.physicalData.distributionUrl.help=La URL para descargar o visualizar el recurso en el formato mencionado.
eml.physicalData.format=Formato del Archivo
eml.physicalData.format.help=Nombre del formato del archivo. <br /><b>Ejemplo(s)\:</b><br /><i>Microsoft Excel</i>
eml.physicalData.formatVersion=Versión del Formato del Archivo
eml.physicalData.formatVersion.help=Versión del formato del archivo. <br /><b>Ejemplo(s)\:</b><br /><i>2000 (9.0.2720)</i>
eml.physicalData.other=Otros formatos de los datos
eml.physicalData.other.help=Enlaces a los datos del recurso en otros formatos (por ejemplo, otras bases de datos, hojas de cálculo, nexus, datos enlazados, etc.).
eml.keywords.keywordThesaurus=Tesauro/Vocabulario
eml.keywords.keywordThesaurus.help=El nombre del tesauro/vocabulario de donde la palabra clave fue derivada. Los tesauros de palabras clave son por lo general específicos de la disciplina y pueden ser personalizados u oficiales. Si las palabras claves no se han extraído de un tesauro/vocabulario específico, ingrese <i>''n/a''</i><br /><br /><b>Ejemplo(s)\: </b><br /><i>"Tesauro IRIS de palabras clave"</i>
eml.keywords.keywordsString=Lista de palabras clave
eml.keywords.keywordsString.help=Palabras clave que describen de manera concisa el recurso o se relacionan con éste. Separe cada palabra clave con comas (,).
eml.hierarchyLevel=Nivel de jerarquía
eml.hierarchyLevel.help=Nivel del conjunto de datos que aplica para los metadatos. El valor por defecto para GBIF es <i>conjunto de datos</i>.
eml.pubDate=Última Fecha de Publicación
eml.pubDate.help=La fecha en la que el recurso fue publicado por última vez. Este elemento se actualiza de manera automática cada vez que el recurso es actualizado.
eml.dateStamp=Fecha de la Primera Publicación
eml.dateStamp.help=La fecha en la cual la primera versión del recurso fue publicada o disponible al público. Se utilizará como el año de publicación en la referencia del recurso.
eml.distributionUrl=URL del recurso
eml.distributionUrl.short=Inicio
eml.logoUrl=URL del logo del recurso
eml.logoUrl.help=La URL del logo asociado con el recurso. Si no posee una URL para el logo del recurso, puede subir una imagen desde su disco.
eml.purpose=Propósito
eml.purpose.description=Una sinopsis del propósito de este conjunto de datos. Puede incluir uno o más párrafos, incluido un resumen de los hallazgos clave, si corresponde.
eml.purpose.help=Puede ingresar HTML haciendo clic en <b>&lt;/&gt;</b>. El HTML se convertirá a DocBook en el EML, por lo que algunas combinaciones HTML podrían no funcionar.<br/><br/>Etiquetas HTML permitidas\: <ul><li><b>&lt;div&gt;</b></li> <li><b>&lt;p&gt;</b></li> <li><b>&lt;ul&gt;</b></li> <li><b>&lt;ol&gt;</b></li> <li><b>&lt;li&gt;</b></li> <li><b>&lt;h1&gt;</b></li> <li><b>&lt;pre&gt;</b></li> <li><b>&lt;a&gt;</b></li> <li><b>&lt;b&gt;</b></li> <li><b>&lt;em&gt;</b></li> <li><b>&lt;sup&gt;</b></li> <li><b>&lt;sub&gt;</b></li></ul>
eml.purpose.unsupportedHtmlInput1=El campo de propósito contiene una etiqueta HTML no compatible\:
eml.purpose.unsupportedHtmlInput2=Por favor corrija la entrada. Haga clic en el ícono de información al lado del campo para obtener detalles sobre los formatos permitidos.

eml.additionalInfo=Información adicional
eml.additionalInfo.help=Cualquier información que no esté descrita en los demás campos de los metadatos, p. ej.\: historia del proyecto, publicaciones que han usado estos datos, información sobre datos relacionados publicados en otro lugar, etc.
eml.specimenPreservationMethod=Método de preservación de los ejemplares
eml.specimenPreservationMethod.short=método de preservación
eml.specimenPreservationMethod.plural=Métodos de preservación de los ejemplares
eml.specimenPreservationMethod.plural.help=La lista de métodos de preservación de ejemplares usados en este recurso.
eml.specimenPreservationMethod.help=Palabra clave del vocabulario Método de Preservación de Ejemplares de GBIF, indica el proceso o técnica utilizada para prevenir el deterioro físico de las colecciones no vivientes. Si la colección tiene más de un método de preservación, seleccione el predominante. Recuerde que puede incluir una lista de métodos de preparación y preservación para un ejemplar en el elemento "Preparaciones" en el mapeo de datos DwC (http\://rs.tdwg.org/dwc/terms/preparations). Por favor, no seleccione ningún tratamiento para colecciones vivas.
eml.alternateIdentifier=Identificador alternativo
eml.alternateIdentifier.help=Un identificador secundario adicional para esta entidad. Cuando el recurso es publicado, la URL del IPT al recurso se adiciona a la lista de identificadores. Cuando un recurso le es asignado un DOI nuevo (utilizando el IPT), el IPT asegura que este DOI sea ubicado de primero en la lista de identificadores. Cuando un recurso es registrado en el Registro GBIF, el UUID del registro también se agrega a la lista de identificadores. Si el recurso representa un recurso existente registrado en el Registro GBIF, el UUID del recurso existente registrado puede añadirse a la lista de identificadores. Esto permitirá que el recurso IPT actualice el recurso existente durante el registro, en lugar de registrar un nuevo recurso.<br /><b>Ejemplo(s)\:</b><br /><i>4fa7b334-ce0d-4e88-aaae-2e0c138d049e</i>, <i>VCR3465</i>

eml.intellectualRights.simple=Derechos
eml.intellectualRights.licence.cczero=En la medida de lo posible según la ley, el publicador ha renunciado a todos los derechos sobre estos datos y los ha dedicado al <a href\="http\://creativecommons.org/publicdomain/zero/1.0/legalcode"> Dominio público (CC0 1.0)</a>. Los usuarios pueden copiar, modificar, distribuir y utilizar la obra, incluso con fines comerciales, sin restricciones.
eml.intellectualRights.licence.ccby=Esta obra está bajo una licencia <a href\="https\://creativecommons.org/licenses/by/4.0/legalcode.es">Creative Commons de Atribución/Reconocimiento (CC-BY 4.0)</a>.
eml.intellectualRights.licence.ccbync=Esta obra está bajo una licencia <a href\="https\://creativecommons.org/licenses/by-nc/4.0/legalcode.es">Creative Commons de Atribución/Reconocimiento-NoComercial (CC-BY-NC 4.0)</a>.
eml.intellectualRights.license=Licencia de los datos
eml.intellectualRights.license.help=La licencia que se aplica a un conjunto de datos proporciona una forma estandarizada de definir el uso apropiado de su trabajo. GBIF invita a los publicadores a adoptar la licencia menos restrictiva posible entre tres opciones de lectura mecánica (CC0 1.0, CC-BY 4.0 o CC-BY-NC 4.0), para fomentar de la manera más amplia posible el uso y aplicación de los datos. Infórmese <a href\="https\://www.gbif.org/es/terms/licences" target\="_blank">aquí</a>. Si no es posible que usted elija una de las tres opciones y su conjunto de datos contiene registros biológicos, no podrá registrar su conjunto de datos en GBIF o hacerlo globalmente visible a través de GBIF.org. Si considera que no puede seleccionar una de las tres opciones, póngase en contacto con el Secretariado de GBIF en participation@gbif.org.
eml.intellectualRights.nolicenses=No hay una licencia seleccionada
eml.intellectualRights.license.disclaimer=Debe aplicar la licencia CC0 solamente a su propio trabajo, a menos que tenga los derechos necesarios para aplicarla al trabajo de un tercero.

