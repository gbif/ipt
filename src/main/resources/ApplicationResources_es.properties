manage.metadata.gettingStarted=Primeros pasos
manage.metadata.gettingStarted.description=Uno o más párrafos que describen la interpretación, el contenido y la estructura generales del conjunto de datos. Por ejemplo, el número y los nombres de los archivos de datos, los tipos de mediciones que contienen, cómo esos archivos de datos encajan en un diseño general y cómo se relacionan con los métodos de recopilación de datos, el diseño experimental y el diseño de muestreo descritos en otras secciones EML. Se podría describir cualquier software especializado que esté disponible y/o pueda ser necesario para analizar o interpretar los datos, y posiblemente incluir una descripción de alto nivel de los formatos de datos si son inusuales.
manage.metadata.gettingStarted.help=Puede ingresar HTML haciendo clic en <b>&lt;/&gt;</b>. El HTML se convertirá a DocBook en el EML, por lo que algunas combinaciones HTML podrían no funcionar.<br/><br/>Etiquetas HTML permitidas\: <ul><li><b>&lt;div&gt;</b></li> <li><b>&lt;p&gt;</b></li> <li><b>&lt;ul&gt;</b></li> <li><b>&lt;ol&gt;</b></li> <li><b>&lt;li&gt;</b></li> <li><b>&lt;h1&gt;</b></li> <li><b>&lt;pre&gt;</b></li> <li><b>&lt;a&gt;</b></li> <li><b>&lt;b&gt;</b></li> <li><b>&lt;em&gt;</b></li> <li><b>&lt;sup&gt;</b></li> <li><b>&lt;sub&gt;</b></li></ul>
