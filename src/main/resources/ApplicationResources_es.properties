manage.overview.publishing.doi.reserve.confirm=Esta punto de solicitar un DOI para este recurso. Tenga en cuenta que todavía puede eliminar el DOI, mientras este no se haya registrado todavía. ¿Quiere solicitarlo?
manage.overview.publishing.doi.reserve.help=Usted puede reservar un DOI para un recurso después de haber documentado los metadatos obligatorios. Para reutilizar un DOI existente, ingréselo en el campo del identificador de la citación en los metadatos del recurso. Si un recurso está públicamente disponible y se ha reservado un DOI, la próxima publicación resultará en una nueva versión con cambios mayores y se registrará el DOI. De otra manera, si un recurso es privado y ha reservado un DOI, la próxima publicación resultará en una nueva versión del recurso con cambios menores y el DOI no se registrará. Tenga en cuenta que usted puede eliminar un DOI no registrado.
manage.overview.publishing.doi.reserve.new.help=Puede solicitar un nuevo DOI para un recurso publicado al que ya le ha sido asignado un DOI. Tenga en cuenta que el DOI se registrará la próxima vez que el recurso se publica y resolverá la versión recién publicada del recurso. El DOI anterior aún resolverá la versión anterior, pero mostrará una advertencia que ha sido reemplazado por uno nuevo. También tenga en cuenta que todavía puede eliminar el DOI solicitado mientras este no se publique.
manage.overview.publishing.doi.reserve.prevented.noOrganisation=No puede asignar un DOI a este recurso hasta que una organización con una cuenta de DataCite sea asociada a este IPT. Póngase en contacto con el administrador del IPT para hacerlo.
manage.overview.publishing.doi.delete.confirm=Está a punto de eliminar un DOI solicitado para este recurso. Debido a que nunca se registró este DOI, este nunca estuvo activo y es seguro para eliminar. ¿Quiere eliminarlo?
manage.overview.publishing.doi.delete.help=Puede borrar el DOI solicitado para este recurso. Debido a que nunca se registró este DOI, nunca estuvo activo y es seguro para eliminar.
manage.overview.publishing.doi.register.agreement=Confirme que usted entiende que los DOIs no pueden ser eliminados una vez que son registrados.
manage.overview.publishing.doi.register.help=El DOI que se ha solicitado para la versión pendiente de este recurso, se registrará la próxima vez que publique el recurso.
manage.overview.publishing.doi.register.prevented.notPublic=No se puede registrar el DOI que se ha solicitado para este recurso, porque el recurso es privado. Para registrar el DOI, cambie el estado a público y luego publique una nueva versión.
manage.overview.publishing.doi.minorVersion.confirm=Está a punto de publicar una nueva versión <b><span class\=''text-visibility-{0}''>{1}</span> menor</b> de este recurso. Si se han producido cambios científicamente significativos en el recurso desde la última publicación, debe cancelarlo, asignarle un nuevo DOI y volver a publicarlo.
manage.overview.publishing.doi.majorVersion.confirm=Está a punto de publicar una nueva versión <b><span class\=''text-visibility-{0}''>{1}</span> mayor</b> de este recurso, lo cual es apropiado la primera vez que se asigna un DOI a un recurso, o después de que el recurso haya sufrido cambios científicamente significativos. Tras una publicación correcta, el DOI reservado para este recurso se registrará y debería funcionar en unos 5 minutos. Si esto no es lo que desea, cancele y elimine el DOI reservado.
manage.overview.publishing.withoutDoi.majorVersion.confirm=Está a punto de publicar una nueva versión mayor de este recurso, lo cual es apropiado la primera vez que se publica un recurso, o después de que el recurso haya sufrido cambios científicamente significativos. Si no es lo que desea, cancele.
manage.overview.publishing.doi.summary=Antes de publicar, puede ayudar a los usuarios resumiendo lo que ha cambiado en esta versión.
manage.overview.publishing.doi.summary.placeholder=Ayude a los usuarios resumiendo lo que ha cambiado en esta versión. Siempre puedes editar esto más tarde.
manage.overview.publishing.doi.confirm.end=¿Quiere publicar?
manage.overview.publishing.doi.replaced=El DOI asignado a la versión actual sera remplazado por el DOI solicitado para la versión pendiente la próxima vez que se publique el recurso.
manage.overview.publishing.doi.reserve.reused=Un DOI existente [{0}] ya ha sido asignado a este recurso y será reutilizado. Si este no es el DOI correcto, puede eliminar el DOI solicitado, quitar o reemplazar el DOI desde el campo de identificador de la referencia en los metadatos del recurso y luego tratar de solicitar otro DOI.
manage.overview.publishing.doi.reserve.notRreused=Un DOI existente [{0}] ya ha sido asignado a este recurso, sin embargo, no puede ser reutilizado porque este IPT se limita a registrar DOIs bajo el prefijo {1}. Puede quitar o reemplazar el DOI desde el campo de identificador de la referencia en los metadatos del recurso y luego tratar de solicitar otro DOI. Si aún desea utilizar este DOI, póngase en contacto con el administrador del IPT para obtener ayuda.
