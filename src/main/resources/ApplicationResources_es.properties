manage.metadata.introduction.description=De uno a muchos párrafos que brindan antecedentes y contexto para el conjunto de datos con cifras y referencias apropiadas.  Esto es similar a la introducción de un artículo de revista e incluiría, por ejemplo, los objetivos del proyecto, las hipótesis que se abordan, lo que se sabe sobre el patrón o proceso en estudio, cómo se han utilizado los datos hasta la fecha (incluidas las referencias) y cómo podrían usarse en el futuro.
